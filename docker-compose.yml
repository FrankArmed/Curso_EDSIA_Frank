services:
  # Base de datos PostgreSQL.
  db:
    image: postgres:16

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # Permite conectarnos enn Windows
    ports:
      - "5432:5432"

    # Conserva los datos aunque se reinicie el contenedor.
    volumes:
      - pgdata:/var/lib/postgresql/data

    # Comprueba que PostgreSQL esté listo.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # API de SensorHub.
  api:
    build: .

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

    # La API espera a que PostgreSQL esté disponible.
    depends_on:
      db:
        condition: service_healthy


# Volumen utilizado para guardar los datos de PostgreSQL.
volumes:
  pgdata: