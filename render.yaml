services:
  # API pública de SensorHub.
  - type: web
    name: sensorhub-api-frank
    runtime: docker
    plan: free
    healthCheckPath: /health

    # Despliega automáticamente los commits de la rama conectada.
    autoDeployTrigger: checksPass

    # Obtiene la conexión sin guardar credenciales en Git.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sensorhub-db
          property: connectionString

databases:
  # Base PostgreSQL utilizada por la API.
  - name: sensorhub-db
    plan: free
    databaseName: sensorhub
    user: sensorhub