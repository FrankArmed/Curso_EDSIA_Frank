[tool.pytest.ini_options]
testpaths = [
    "semana0",
    "semana1",
    "semana2/eval1/tests",
]
addopts = "-ra --cov=semana2.eval1 --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true